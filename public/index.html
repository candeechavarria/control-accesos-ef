<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sistema de Control de Accesos · Estación Ferreyra</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,500;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
  /* ========== BRAND PALETTE (manual de marca Estación Ferreyra) ========== */
  :root {
    --ef-ink: #001233;          /* navy más oscuro - textos principales */
    --ef-navy: #002355;         /* navy intermedio */
    --ef-blue: #023E7D;         /* azul secundario */
    --ef-accent: #0466C9;       /* azul vivo - acciones */
    --ef-divider: #E4E4E4;      /* gris bordes y separadores */
    --ef-bg: #F4F4F4;           /* fondo de pantalla */

    --bg: var(--ef-bg);
    --card: #ffffff;
    --ink: var(--ef-ink);
    --muted: #6B7280;
    --accent: var(--ef-accent);
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
  }
  /* Arboria Book es licenciada por Adobe Fonts. Nunito Sans es la alternativa libre
     más cercana en términos de geometría y peso visual. */
  html, body { background: var(--bg); color: var(--ink); font-family: 'Nunito Sans', system-ui, sans-serif; }
  h1, h2, h3, .display { font-family: 'Raleway', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 2px rgba(0,18,51,.04), 0 1px 2px rgba(0,18,51,.05); border: 1px solid var(--ef-divider); }
  .gradient-top { background: linear-gradient(90deg, var(--ef-ink) 0%, var(--ef-blue) 50%, var(--ef-accent) 100%); height: 6px; border-radius: 12px 12px 0 0; }
  .gradient-top-green { background: linear-gradient(90deg, #14532d 0%, #16a34a 100%); height: 6px; border-radius: 12px 12px 0 0; }
  .btn-primary { background: var(--ef-accent); color: #fff; transition: background .15s; }
  .btn-primary:hover { background: var(--ef-blue); }
  .btn-primary:disabled { background: #B8C5D6; cursor: not-allowed; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { background: #15803d; }
  .btn-green:disabled { background: #86efac; cursor: not-allowed; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-outline { border: 1px solid var(--ef-divider); background: #fff; color: var(--ink); }
  .pill { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill-blue { background: var(--ef-accent); color: #fff; }
  .pill-dark { background: var(--ef-ink); color: #fff; }
  .pill-gray { background: var(--ef-bg); color: #475569; border: 1px solid var(--ef-divider); }
  .pill-red { background: #fee2e2; color: #b91c1c; }
  .pill-green { background: #dcfce7; color: #166534; }
  .pill-amber { background: #fef3c7; color: #92400e; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
  .dot-green { background: #16a34a; }
  .dot-red { background: #dc2626; }
  .dot-blue { background: var(--ef-accent); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,18,51,.2); padding: 14px 18px; min-width: 280px; animation: slideIn .3s ease-out; z-index: 50; border-left: 4px solid var(--ef-accent); }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .15s; }
  .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 999px; transition: .15s; }
  .switch input:checked + .slider { background: var(--ef-accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .input { width: 100%; padding: 10px 14px; border: 1px solid var(--ef-divider); border-radius: 8px; background: #FAFBFC; outline: none; font-size: 14px; font-family: inherit; }
  .input:focus { border-color: var(--ef-accent); background: #fff; box-shadow: 0 0 0 3px rgba(4,102,201,.08); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); padding: 12px 16px; letter-spacing: .05em; font-family: 'Raleway', sans-serif; }
  td { padding: 14px 16px; border-top: 1px solid var(--ef-divider); font-size: 14px; vertical-align: top; }
  tr:hover td { background: var(--ef-bg); }
  .tab { padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; font-family: 'Raleway', sans-serif; }
  .tab.active { background: #fff; box-shadow: 0 1px 2px rgba(0,18,51,.08); color: var(--ink); }
  .tab:not(.active) { color: var(--muted); }
  .tabs-wrap { background: var(--ef-bg); padding: 6px; border-radius: 10px; display: inline-flex; gap: 4px; flex-wrap: wrap; border: 1px solid var(--ef-divider); }
  .code-box { background: #fff; border: 2px solid var(--ef-ink); padding: 14px 28px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; letter-spacing: 6px; display: inline-block; color: var(--ef-ink); }
  .demo-pill { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #fef3c7; color: #92400e; font-size: 12px; padding: 4px 12px; border-radius: 999px; font-weight: 600; z-index: 40; border: 1px solid #fde68a; }
  .kpi { background: #fff; border-radius: 10px; padding: 16px 20px; border: 1px solid var(--ef-divider); }
  .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-family: 'Raleway', sans-serif; font-weight: 600; }
  .kpi-value { font-family: 'Raleway', sans-serif; font-size: 28px; font-weight: 700; color: var(--ink); }
  .audit-row { padding: 12px 16px; border-bottom: 1px solid var(--ef-divider); font-size: 13px; }
  .audit-row:hover { background: var(--ef-bg); }
  .role-badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 700; text-transform: uppercase; font-family: 'Raleway', sans-serif; }
  .role-admin { background: #fef3c7; color: #92400e; }
  .role-generador { background: rgba(4,102,201,.12); color: var(--ef-blue); }
  .role-verificador { background: #dcfce7; color: #166534; }
  .role-sistema { background: var(--ef-bg); color: var(--muted); }
  /* Logo */
  .brand-logo { display: block; height: auto; }
</style>
</head>
<body>
<div id="app" class="min-h-screen"></div>

<script>
// =========================================================
// LOGO "EF ESTACIÓN FERREYRA" — imagen oficial del manual de marca
// =========================================================
const LOGO_PATH = 'logo_ef.png';
// Cache de la imagen como data URL para uso en el PDF (jsPDF.addImage)
let LOGO_DATA_URL = null;
let LOGO_NATURAL_RATIO = 800 / 93; // ancho/alto aproximado del PNG

function loadLogoDataURL() {
  if (LOGO_DATA_URL) return Promise.resolve(LOGO_DATA_URL);
  return fetch(LOGO_PATH)
    .then(r => { if (!r.ok) throw new Error('No se pudo cargar el logo'); return r.blob(); })
    .then(blob => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => { LOGO_DATA_URL = reader.result; resolve(LOGO_DATA_URL); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    }));
}
// Logo marca completo (logo + texto) o solo el bloque del logo, vía <img>.
// Recibe altura en px y mantiene proporción nativa del archivo.
function svgLogoMark(height = 36) {
  return `<img src="${LOGO_PATH}" alt="EF Estación Ferreyra" class="brand-logo" style="height: ${height}px;">`;
}
function svgLogoFull(height = 30) {
  // El logo oficial ya incluye el texto, así que devuelve la misma imagen.
  return `<img src="${LOGO_PATH}" alt="Estación Ferreyra S.R.L." class="brand-logo" style="height: ${height}px;">`;
}

// =========================================================
// STATE & DATA
// =========================================================
const state = {
  route: 'home', user: null, toast: null,
  genQty: 1, genQtyShortcut: 1, genEmpresa: '', genComprobante: '',
  generatedCodes: [], showConfirmModal: false, autoLogoutSeconds: 60, autoLogoutTimer: null,
  verResult: null,
  adminTab: 'historial', adminUsersSubTab: 'estado',
  filterEstado: 'todos', filterEmpresa: '', filterCreador: '',
  filterPatente: '', filterFechaDesde: '', filterFechaHasta: '',
  newEmpresaNombre: '', newEmpresaCuit: '',
  showEditEmpresaModal: false, editingEmpresaIdx: -1, editingEmpresaNombre: '', editingEmpresaCuit: '', editingEmpresaApi: false,
  showNewUserModal: false, newUserRol: 'generador', newUserName: '', newUserPin: '',
  auditFilterRol: 'todos', auditFilterUser: '', auditFilterText: '',
  cfgDraft: null,
};

// Datos que trae el servidor según el rol (GET /api/datos).
let data = {
  empresas: [], codigos: [], totalCodigos: 0, enSitio: [], stats: { activos: 0, en_sitio: 0, finalizados: 0 },
  usuarios: { generadores: [], verificadores: [] }, auditLog: [],
  config: { codigoValidezDias: 30, estadiaHorasMax: 24, maxCodigosPorGeneracion: 20, headerTexto: '', notifEmailTo: '', notifEmailCc: '', alertaEstadiaHoras: 22 },
};

// =========================================================
// SERVIDOR
// =========================================================
async function api(method, path, body) {
  const r = await fetch('/api' + path, {
    method, credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let json = {};
  try { json = await r.json(); } catch { /* respuesta vacía */ }
  if (r.status === 401 && state.user && path !== '/login') {
    // La sesión venció o el usuario fue deshabilitado.
    state.user = null; stopTimers(); state.route = 'home';
    showToast('Sesión cerrada', json.error || 'Volvé a ingresar', 'error');
    throw new Error(json.error || 'Sesión vencida');
  }
  if (!r.ok) throw new Error(json.error || `Error ${r.status}`);
  return json;
}
// Ejecuta una llamada y muestra el error en un aviso si falla. Devuelve null si falló.
async function tryApi(method, path, body) {
  try { return await api(method, path, body); }
  catch (e) { if (state.user || path === '/login') showToast('Error', e.message, 'error'); return null; }
}
async function loadData() {
  const d = await tryApi('GET', '/datos');
  if (!d) return;
  data = { ...data, ...d };
  if (d.codigos) data.codigos = d.codigos.map(adaptCodigo);
  if (d.enSitio) { data.enSitio = d.enSitio.map(adaptCodigo); state.serverSkew = Date.parse(d.ahora) - Date.now(); }
  if (d.auditLog) data.auditLog = d.auditLog.map(a => ({ ...a, ts: fmtFecha(a.ts) }));
}
// Convierte fechas ISO a "DD/MM/AA HH:MM" (hora de Córdoba) que usan tablas, filtros y gráficos.
function adaptCodigo(c) {
  return { ...c, patente: c.patente || '-', verifico: c.verifico || '-', egreso_user: c.egreso_user || '-',
    generado_iso: c.generado_en, ingreso_iso: c.ingreso_en, vence_iso: c.vence_en,
    generado_en: fmtFecha(c.generado_en), ingreso: fmtFecha(c.ingreso_en), egreso: fmtFecha(c.egreso_en), vence: fmtFecha(c.vence_en) };
}
const TZ = 'America/Argentina/Cordoba';
function fmtFecha(iso) {
  if (!iso) return '-';
  const p = Object.fromEntries(new Intl.DateTimeFormat('es-AR', { timeZone: TZ, day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date(iso)).map(x => [x.type, x.value]));
  return `${p.day}/${p.month}/${p.year} ${p.hour}:${p.minute}`;
}
function fmtFechaLarga(iso) {
  return new Intl.DateTimeFormat('es-AR', { timeZone: TZ, day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(iso));
}
// Escapa texto cargado por usuarios antes de meterlo en el HTML.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

// =========================================================
// HELPERS
// =========================================================
function nowHHMM() { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function todayDDMMAAAA() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function parseDDMMAA(s) {
  if (!s || s === '-') return null;
  const [dmy, hm] = s.split(' ');
  const [dd, mm, yy] = dmy.split('/').map(Number);
  const [h, m] = (hm || '00:00').split(':').map(Number);
  return new Date(2000 + yy, mm - 1, dd, h, m);
}
function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(v => {
    let s = String(v ?? '');
    if (/^[=+\-@]/.test(s)) s = "'" + s; // evita que Excel lo tome como fórmula
    return '"' + s.replace(/"/g, '""') + '"';
  }).join(';')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// =========================================================
// NAV / SESIÓN
// =========================================================
function nav(route) { state.route = route; render(); }
const HOME_BY_ROLE = { generador: 'gen-dashboard', verificador: 'ver-main', admin: 'admin' };
async function afterLogin(user) {
  state.user = { role: user.role, username: user.username, debeCambiar: user.debeCambiar };
  if (user.debeCambiar) { nav('cambiar-clave'); return; }
  await loadData();
  if (user.role === 'verificador') startVerRefresh();
  nav(HOME_BY_ROLE[user.role]);
}
function stopTimers() {
  if (state.autoLogoutTimer) clearInterval(state.autoLogoutTimer);
  if (state.verRefreshTimer) clearInterval(state.verRefreshTimer);
  state.autoLogoutTimer = null; state.verRefreshTimer = null;
}
async function logout() {
  stopTimers();
  const had = !!state.user;
  state.user = null; state.verResult = null; state.generatedCodes = []; state.cfgDraft = null;
  nav('home');
  if (had) { try { await api('POST', '/logout'); } catch { /* la cookie igual se descarta al vencer */ } }
}
async function doLogin(rol, userId, passId) {
  const username = document.getElementById(userId).value.trim().toLowerCase();
  const clave = document.getElementById(passId).value;
  if (!username || !clave) { showToast('Falta dato', 'Completá usuario y clave', 'error'); return; }
  const r = await tryApi('POST', '/login', { rol, username, clave });
  if (r) await afterLogin(r.user);
}
function showToast(title, body, kind='success') {
  state.toast = { title, body, kind };
  render();
  setTimeout(() => { state.toast = null; render(); }, 3200);
}

// =========================================================
// HEADER (con logo + tipografía de marca)
// =========================================================
function renderHeader(roleSubtitle) {
  return `
    <header class="bg-white border-b px-6 py-3 flex items-center justify-between sticky top-0 z-30" style="border-color: var(--ef-divider);">
      <div class="flex items-center gap-4">
        ${svgLogoFull(34)}
        ${roleSubtitle ? `<div class="hidden md:block w-px h-8" style="background: var(--ef-divider);"></div>
          <div class="hidden md:block text-xs font-bold tracking-widest" style="color: var(--ef-blue); font-family: Raleway;">${roleSubtitle}</div>` : ''}
      </div>
      ${state.user ? `
        <div class="flex items-center gap-4">
          <span class="text-sm" style="color: var(--muted);">${esc(state.user.username)}</span>
          <button onclick="logout()" class="btn-outline px-3 py-2 rounded-lg flex items-center gap-2 text-sm font-semibold hover:bg-gray-50">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Salir
          </button>
        </div>
      ` : ''}
    </header>
  `;
}

// =========================================================
// HOME — admin removido, acceso solo por footer discreto + URL
// =========================================================
function renderHome() {
  return `
    ${renderHeader('')}
    <main class="max-w-5xl mx-auto px-6 py-16">
      <div class="text-center mb-12">
        <h1 class="display text-4xl mb-2" style="color: var(--ef-ink);">Sistema de Control de Accesos</h1>
        <p class="text-sm" style="color: var(--muted);">Seleccione su modo de acceso al sistema</p>
      </div>
      <div class="grid md:grid-cols-2 gap-6 max-w-3xl mx-auto">
        <div class="card p-8">
          <div class="gradient-top -mx-8 -mt-8 mb-8"></div>
          <div class="w-14 h-14 rounded-lg flex items-center justify-center mb-5" style="background: rgba(4,102,201,.08);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0466C9" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="7" x2="12" y2="17"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
          </div>
          <h2 class="display text-2xl mb-2">Generador</h2>
          <p class="text-sm mb-5" style="color: var(--muted);">Cree códigos de acceso temporales para vehículos y vea el historial completo.</p>
          <p class="text-xs px-3 py-1 rounded inline-block mb-5" style="background: rgba(217,119,6,.1); color: #92400e;">Requiere inicio de sesión</p>
          <button onclick="nav('gen-login')" class="w-full btn-primary py-3 rounded-lg font-bold" style="font-family: Raleway;">Ingresar como Generador</button>
        </div>
        <div class="card p-8">
          <div class="gradient-top-green -mx-8 -mt-8 mb-8"></div>
          <div class="w-14 h-14 rounded-lg bg-green-100 flex items-center justify-center mb-5">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h2 class="display text-2xl mb-2">Verificador</h2>
          <p class="text-sm mb-5" style="color: var(--muted);">Verifique códigos, registre ingresos y egresos de vehículos.</p>
          <p class="text-xs px-3 py-1 rounded inline-block mb-5" style="background: #dcfce7; color: #166534;">Acceso con clave</p>
          <button onclick="nav('ver-login')" class="w-full btn-green py-3 rounded-lg font-bold" style="font-family: Raleway;">Ingresar como Verificador</button>
        </div>
      </div>
      <div class="mt-16 text-center text-xs" style="color: var(--muted);">
        <a href="javascript:nav('admin-login')" style="color: var(--muted); text-decoration: underline;">Acceso administración</a>
      </div>
    </main>
  `;
}

// =========================================================
// GENERADOR
// =========================================================
function renderGenLogin() {
  return `
    ${renderHeader('GENERADOR')}
    <main class="max-w-md mx-auto px-6 py-16">
      <div class="card p-8">
        <div class="gradient-top -mx-8 -mt-8 mb-8"></div>
        <div class="flex justify-center mb-4">${svgLogoMark(48)}</div>
        <h2 class="display text-2xl text-center mb-1">Iniciar Sesión</h2>
        <p class="text-sm text-center mb-6" style="color: var(--muted);">Ingrese sus credenciales para acceder al generador de códigos.</p>
        <form onsubmit="event.preventDefault(); doLogin('generador', 'genUser', 'genPin');" class="space-y-4">
          <div><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Usuario</label><input id="genUser" class="input" autocomplete="username" autocapitalize="none" /></div>
          <div><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Clave (6 dígitos)</label><input id="genPin" type="password" inputmode="numeric" maxlength="6" class="input" autocomplete="current-password" /></div>
          <button type="submit" class="w-full btn-primary py-3 rounded-lg font-bold" style="font-family: Raleway;">Ingresar</button>
          <button type="button" onclick="nav('home')" class="w-full text-sm hover:underline" style="color: var(--muted);">Volver al inicio</button>
        </form>
      </div>
    </main>
  `;
}
function renderGenDashboard() {
  const activos = data.stats.activos, enSitio = data.stats.en_sitio, finalizados = data.stats.finalizados;
  const canCreate = state.genEmpresa && state.genComprobante.trim().length > 0 && state.genQty <= data.config.maxCodigosPorGeneracion;
  return `
    ${renderHeader('GENERADOR')}
    <main class="max-w-4xl mx-auto px-6 py-8">
      <div class="grid grid-cols-3 gap-4 mb-6">
        ${statCard('Activos Ahora', activos, 'var(--ef-ink)', 'activity')}
        ${statCard('En Sitio', enSitio, 'var(--green)', 'users')}
        ${statCard('Finalizados', finalizados, 'var(--ef-accent)', 'check')}
      </div>
      <div class="card p-6">
        <div class="gradient-top -mx-6 -mt-6 mb-6"></div>
        <h2 class="display text-2xl">Generar Códigos de Acceso</h2>
        <p class="text-sm mb-6" style="color: var(--muted);">Los códigos son válidos por ${data.config.codigoValidezDias} días. Una vez ingresado, la estadía es de ${data.config.estadiaHorasMax}hs.</p>
        <div class="mb-4">

// PDF (con logo real embebido vía jsPDF.addImage)
// =========================================================
function drawLogoPDF(doc, x, y, heightMM) {
  if (!LOGO_DATA_URL) return; // si no cargó, el PDF se genera sin logo y no rompe
  const widthMM = heightMM * LOGO_NATURAL_RATIO;
  try {
    doc.addImage(LOGO_DATA_URL, 'PNG', x, y, widthMM, heightMM, undefined, 'FAST');
  } catch (e) {
    console.warn('No se pudo embeber el logo en el PDF', e);
  }
}

async function downloadCodesPDF() {
  if (!state.generatedCodes || state.generatedCodes.length === 0) { showToast('Sin códigos', 'No hay códigos para descargar', 'error'); return; }
  if (!window.jspdf?.jsPDF) { showToast('Error', 'Librería PDF no disponible', 'error'); return; }
  // Asegurar logo cargado antes de generar el PDF
  try { await loadLogoDataURL(); } catch (e) { console.warn('Logo no disponible para PDF', e); }
  const { jsPDF } = window.jspdf;

  // === FORMATO TICKET TÉRMICO 80x135mm (Fortx TTP88) ===
  // Todo en NEGRO y NEGRITA. Mínimo de fuente: 6.5pt para legibilidad térmica.
  // Margen lateral: 4mm. Área útil: 72mm.
  const TW = 80;     // ancho ticket
  const TH = 135;    // alto ticket por comprobante
  const M = 4;       // margen lateral
  const CX = TW / 2; // centro horizontal

  const doc = new jsPDF({ unit: 'mm', format: [TW, TH], orientation: 'portrait' });
  const codes = state.generatedCodes;
  const g = state.genResult;
  const empresa = g.empresa;
  const comprobante = g.comprobante;
  const fechaEmision = todayDDMMAAAA();
  const fechaVence = fmtFechaLarga(g.venceEn);

  // Helper para truncar valores largos (que no rompan el layout)
  const fit = (txt, maxChars) => (txt && txt.length > maxChars) ? txt.slice(0, maxChars - 1) + '…' : (txt || '');

  codes.forEach((codigo, idx) => {
    if (idx > 0) doc.addPage([TW, TH], 'portrait');

    // ---- HEADER (logo + nombre + subtítulo) ----
    if (LOGO_DATA_URL) {
      const logoH = 3.2;
      const logoW = logoH * LOGO_NATURAL_RATIO; // ~27.5mm con ratio 8.6
      try {
        doc.addImage(LOGO_DATA_URL, 'PNG', CX - logoW / 2, 4, logoW, logoH, undefined, 'FAST');
      } catch (e) { /* logo opcional */ }
    }

    doc.setTextColor(0, 0, 0);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.text('ESTACIÓN FERREYRA S.R.L.', CX, 11, { align: 'center' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(6.5);
    doc.setTextColor(0, 0, 0);
    doc.text('Sistema de Control de Accesos', CX, 14.5, { align: 'center' });

    // Línea de separación negra
    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.5);
    doc.line(M, 17.5, TW - M, 17.5);

    // ---- TÍTULO ----
    doc.setTextColor(0, 0, 0);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text('COMPROBANTE DE ACCESO', CX, 23, { align: 'center' });

    // Contador "Código N de N" si hay más de uno
    if (codes.length > 1) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);
      doc.setTextColor(0, 0, 0);
      doc.text(`Código ${idx + 1} de ${codes.length}`, TW - M, 23, { align: 'right' });
    }

    // ---- DATOS (Empresa, Comprobante, Emitido) ----
    let y = 30;
    const dataRow = (label, value, maxChars) => {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);
      doc.setTextColor(0, 0, 0);
      doc.text(label, M, y);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(fit(value, maxChars), M, y + 3.3);
      y += 7;
    };
    dataRow('EMPRESA', empresa, 38);
    dataRow('COMPROBANTE', comprobante, 38);
    dataRow('EMITIDO', `${fechaEmision} · ${state.user.username}`, 38);

    // ---- CAJA DEL CÓDIGO (la estrella del comprobante) ----
    const boxY = 53;
    const boxH = 27;
    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.8);
    doc.roundedRect(M, boxY, TW - 2 * M, boxH, 2, 2, 'S');

    doc.setTextColor(0, 0, 0);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(6.5);
    doc.text('CÓDIGO DE ACCESO', CX, boxY + 5, { align: 'center' });

    doc.setFont('courier', 'bold');
    doc.setFontSize(32);
    doc.setTextColor(0, 0, 0);
    doc.text(codigo, CX, boxY + 21, { align: 'center' });

    // ---- VENCIMIENTO ----
    doc.setFontSize(8);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(0, 0, 0);
    doc.text(`Válido hasta: ${fechaVence}`, CX, boxY + boxH + 5, { align: 'center' });

    // ---- INSTRUCCIONES ----
    const insY = boxY + boxH + 9;
    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.3);
    doc.line(M, insY, TW - M, insY);

    doc.setTextColor(0, 0, 0);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7);
    doc.text('INSTRUCCIONES', M, insY + 4);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(6.5);
    doc.setTextColor(0, 0, 0);
    const maxLineWidth = TW - 2 * M; // 72mm de ancho útil
    const rawLines = [
      `• Válido ${g.validezDias} días desde la emisión.`,
      `• Una vez ingresado, estadía máx. ${g.estadiaHoras}hs. Al excederse este plazo se cobrará el monto correspondiente a una estadía adicional.`,
      '• Presentar al ingresar al playón.',
      '• Uso único: caduca al egresar.',
    ];
    let lineY = insY + 9;
    rawLines.forEach(t => {
      const wrapped = doc.splitTextToSize(t, maxLineWidth);
      wrapped.forEach(w => { doc.text(w, M, lineY); lineY += 3.5; });
    });

    // ---- PIE: linea de corte + timestamp ----
    const cutY = TH - 5;
    try {
      doc.setLineDashPattern([0.6, 0.6], 0);
      doc.setDrawColor(150, 150, 150);
      doc.setLineWidth(0.3);
      doc.line(0, cutY, TW, cutY);
      doc.setLineDashPattern([], 0);
    } catch (e) { /* algunos jsPDF no soportan dash */ }

    doc.setTextColor(0, 0, 0);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(6.5);
    doc.text(`Emitido ${fechaEmision} ${nowHHMM()} · No requiere firma`, CX, TH - 2, { align: 'center' });
  });
  const filename = `comprobantes_${empresa.replace(/\s+/g, '_')}_${fechaEmision.replace(/\//g, '-')}.pdf`;
  doc.save(filename);
  api('POST', '/eventos', { accion: 'PDF descargado', detalle: `${codes.length} comprobante(s) · ${filename}` }).catch(() => {});
  showToast('PDF descargado', `${codes.length} comprobante(s) guardado(s)`);
}

// Tiempo de estadía restante (o excedido) según la hora del servidor.
function stayLabel(ingresoIso, horas) {
  const now = Date.now() + (state.serverSkew || 0);
  let ms = Date.parse(ingresoIso) + horas * 3600000 - now;
  const over = ms < 0; ms = Math.abs(ms);
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  const alerta = !over && (horas * 3600000 - ms) >= data.config.alertaEstadiaHoras * 3600000;
  return { text: over ? `⚠ Excedido ${h}h ${m}m` : `⏱ Quedan ${h}h ${m}m`, color: over ? 'var(--red)' : alerta ? '#b45309' : '#92400e' };
}
function updateStayTimers() {
  document.querySelectorAll('[data-stay]').forEach(el => {
    const l = stayLabel(el.dataset.stay, Number(el.dataset.horas));
    el.textContent = l.text; el.style.color = l.color;
  });
}
// Refresca la lista de vehículos cada 30 s (otros verificadores pueden registrar movimientos).
function startVerRefresh() {
  if (state.verRefreshTimer) clearInterval(state.verRefreshTimer);
  let n = 0;
  state.verRefreshTimer = setInterval(async () => {
    updateStayTimers();
    if (++n % 3 !== 0 || state.route !== 'ver-main') return;
    await loadData();
    if (!state.user || state.route !== 'ver-main') return;
    const input = document.getElementById('verCodigoInput');
    const pat = document.getElementById('verPatenteInput');
    const keep = { code: input?.value, pat: pat?.value, focus: document.activeElement?.id };
    render();
    if (keep.code != null && document.getElementById('verCodigoInput')) document.getElementById('verCodigoInput').value = keep.code;
    if (keep.pat != null && document.getElementById('verPatenteInput')) document.getElementById('verPatenteInput').value = keep.pat;
    if (keep.focus) document.getElementById(keep.focus)?.focus();
  }, 10000);
}

function filteredCodigos() {
  return data.codigos.filter(c => {

    if (state.filterEmpresa && !c.empresa.toLowerCase().includes(state.filterEmpresa.toLowerCase())) return false;
    if (state.filterCreador && !c.creador.toLowerCase().includes(state.filterCreador.toLowerCase())) return false;
    if (state.filterPatente && !c.patente.toLowerCase().includes(state.filterPatente.toLowerCase())) return false;
    if (state.filterFechaDesde) {
      const d = parseDDMMAA(c.generado_en); const desde = new Date(state.filterFechaDesde);

    if (state.filterFechaHasta) {

    }
    return true;
  });
}

let __charts = [];
function destroyCharts() { __charts.forEach(c => c.destroy()); __charts = []; }
function renderCharts() {
  if (!window.Chart) return;
  destroyCharts();
  const empresasCount = {};
  data.codigos.forEach(c => { empresasCount[c.empresa] = (empresasCount[c.empresa] || 0) + 1; });
  const empresasSorted = Object.entries(empresasCount).sort((a,b)=>b[1]-a[1]).slice(0, 8);
  const ctx1 = document.getElementById('chartEmpresas');
  if (ctx1) __charts.push(new Chart(ctx1, { type: 'bar', data: { labels: empresasSorted.map(x=>x[0]), datasets: [{ label: 'Códigos', data: empresasSorted.map(x=>x[1]), backgroundColor: '#0466C9' }] }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } }));
  const ctx2 = document.getElementById('chartEstados');
  if (ctx2) __charts.push(new Chart(ctx2, { type: 'doughnut', data: { labels: ['Creado', 'En Sitio', 'Finalizado'], datasets: [{ data: [
    data.codigos.filter(c=>c.estado==='Creado').length,
    data.codigos.filter(c=>c.estado==='En Sitio').length,
    data.codigos.filter(c=>c.estado==='Finalizado').length,
  ], backgroundColor: ['#E4E4E4', '#001233', '#0466C9'] }] }, options: { plugins: { legend: { position: 'bottom' } } } }));
  const byDay = {};
  data.codigos.forEach(c => { const d = c.generado_en.split(' ')[0]; if (d && d !== '-') byDay[d] = (byDay[d] || 0) + 1; });
  const days = Object.keys(byDay).sort((a,b)=>{
    const [da,ma,ya]=a.split('/').map(Number); const [db,mb,yb]=b.split('/').map(Number);
    return new Date(2000+ya,ma-1,da)-new Date(2000+yb,mb-1,db);
  });
  const ctx3 = document.getElementById('chartTiempo');
  if (ctx3) __charts.push(new Chart(ctx3, { type: 'line', data: { labels: days, datasets: [{ label: 'Códigos generados', data: days.map(d=>byDay[d]), borderColor: '#023E7D', backgroundColor: 'rgba(2,62,125,.12)', tension: 0.35, fill: true }] }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } }));
  const byHour = Array(24).fill(0);
  data.codigos.forEach(c => { const h = c.ingreso.split(' ')[1]; if (h && h !== '-') { const hh = parseInt(h.split(':')[0]); if (!isNaN(hh)) byHour[hh]++; }});
  const ctx4 = document.getElementById('chartHoras');
  if (ctx4) __charts.push(new Chart(ctx4, { type: 'bar', data: { labels: byHour.map((_,i)=>`${i}h`), datasets: [{ label: 'Ingresos', data: byHour, backgroundColor: '#002355' }] }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } }));
}

    claveAdmin: document.getElementById('adminReauthInput').value,
  });
  if (!r) return;
  state.showEditEmpresaModal = false; state.editingEmpresaIdx = -1;
  if (r.token) state.newApiToken = { empresa: state.editingEmpresaNombre.trim(), token: r.token };
  await loadData();
  showToast('Empresa actualizada', '');
}
// El token completo se muestra una sola vez: en la base queda solo su huella.
function renderTokenModal() {
  const t = state.newApiToken;
  return `<div class="fixed inset-0 bg-black/40 z-40 flex items-center justify-center">

      <h3 class="display text-lg mb-2">🔑 Token de API para ${esc(t.empresa)}</h3>
      <p class="text-sm mb-3" style="color: var(--muted);">Copialo ahora y pasáselo a la empresa: <strong>no se vuelve a mostrar</strong>. Si se pierde, se genera uno nuevo.</p>
      <div class="p-3 rounded-lg mb-3 break-all text-sm" style="background: var(--ef-bg); font-family: 'Courier New', monospace;">${esc(t.token)}</div>
      <p class="text-xs mb-4" style="color: var(--muted);">Uso: <code>GET ${location.origin}/api/externo/codigos</code> con el encabezado <code>Authorization: Bearer &lt;token&gt;</code>.</p>
      <div class="flex gap-2 justify-end">
        <button onclick="navigator.clipboard.writeText(state.newApiToken.token).then(() => showToast('Copiado', ''))" class="btn-outline px-4 py-2 rounded-lg font-semibold">Copiar</button>
        <button onclick="state.newApiToken=null; render();" class="btn-primary px-4 py-2 rounded-lg font-semibold">Listo, ya lo guardé</button>

}

function renderAdminUsuarios() {
  return `<div class="mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <button onclick="state.adminUsersSubTab='estado'; render();" class="${state.adminUsersSubTab==='estado'?'text-white':'btn-outline'} px-4 py-2 rounded-lg font-bold text-sm" style="${state.adminUsersSubTab==='estado'?'background: var(--ef-ink); font-family: Raleway;':'font-family: Raleway;'}">Estado</button>
      <button onclick="state.adminUsersSubTab='credenciales'; render();" class="${state.adminUsersSubTab==='credenciales'?'text-white':'btn-outline'} px-4 py-2 rounded-lg font-bold text-sm" style="${state.adminUsersSubTab==='credenciales'?'background: var(--ef-ink); font-family: Raleway;':'font-family: Raleway;'}">Credenciales</button>
    </div>
    <button onclick="openNewUserModal()" class="btn-primary px-4 py-2 rounded-lg text-sm font-bold" style="font-family: Raleway;">+ Nuevo usuario</button>
  </div>
  <div class="grid lg:grid-cols-2 gap-6">
    ${userColumn('Generadores de Códigos', 'Usuarios que pueden crear códigos de acceso', 'dot-blue', data.usuarios.generadores, 'generadores')}
    ${userColumn('Verificadores de Ingreso', 'Usuarios que registran ingresos y egresos', 'dot-green', data.usuarios.verificadores, 'verificadores')}
  </div>
  <div class="mt-6 p-4 rounded-lg text-xs" style="background: var(--ef-bg); border: 1px solid var(--ef-divider); color: var(--muted);">
    🔒 <strong>Reset de PIN:</strong> deshabilitado por política. Si un usuario olvida su PIN, deshabilitar la cuenta actual y crear una nueva.
  </div>`;
}
function userColumn(title, sub, dotClass, list, key) {
  return `<div class="card p-6">
    <h3 class="display text-lg flex items-center gap-2 mb-1"><span class="dot ${dotClass}"></span>${title}</h3>
    <p class="text-sm mb-4" style="color: var(--muted);">${sub}</p>
    ${list.map((u, i) => `<div class="flex items-center justify-between py-3" style="border-bottom: 1px solid var(--ef-divider);">
      <div class="flex items-center gap-2">
        <span class="dot ${u.active?'dot-green':'dot-red'}"></span>
        <span class="font-semibold">${esc(u.user)}</span>
        ${u.bloqueado ? '<span class="pill pill-amber">Bloqueado 15 min</span>' : ''}
        ${state.adminUsersSubTab==='credenciales' ? `<span class="ml-2 tracking-widest" style="color: var(--muted);">••••••</span>` : ''}
        ${!u.active && state.adminUsersSubTab==='estado' ? '<span class="pill pill-red">Deshabilitado</span>' : ''}
      </div>
      ${state.adminUsersSubTab==='estado'
        ? `<label class="switch"><input type="checkbox" ${u.active?'checked':''} onchange="toggleUser('${key}', ${i}, this)" /><span class="slider"></span></label>`
        : `<span class="text-xs italic" style="color: var(--muted);">PIN no editable</span>`}
    </div>`).join('')}
  </div>`;
}
async function toggleUser(key, i, el) {
  const u = data.usuarios[key][i];
  el.disabled = true;
  if (!await tryApi('PUT', `/usuarios/${u.id}`, { active: !u.active })) { el.checked = u.active; el.disabled = false; return; }
  await loadData();
  showToast(!u.active ? 'Usuario habilitado' : 'Usuario deshabilitado', u.user);
}
function openNewUserModal() {
  state.showNewUserModal = true;
  state.newUserRol = 'generador'; state.newUserName = ''; state.newUserPin = '';
  render();
}
function closeNewUserModal() { state.showNewUserModal = false; render(); }
function renderNewUserModal() {
  return `<div class="fixed inset-0 bg-black/40 z-40 flex items-center justify-center" onclick="if(event.target===this) closeNewUserModal()">
    <div class="card p-6 max-w-md w-full mx-4" onclick="event.stopPropagation()">
      <h3 class="display text-lg mb-2">+ Nuevo usuario</h3>
      <p class="text-xs mb-4" style="color: var(--muted);">El PIN se entrega en mano. Queda guardado cifrado: después nadie lo puede ver ni cambiar.</p>
      <div class="mb-3"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Rol</label>
        <select class="input" onchange="state.newUserRol=this.value;">
          <option value="generador" ${state.newUserRol==='generador'?'selected':''}>Generador</option>
          <option value="verificador" ${state.newUserRol==='verificador'?'selected':''}>Verificador</option>
        </select></div>
      <div class="mb-3"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Usuario</label>
        <input class="input" maxlength="30" autocapitalize="none" placeholder="Ej: lopez" value="${esc(state.newUserName)}" oninput="state.newUserName=this.value;" /></div>
      <div class="mb-4"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">PIN (6 dígitos)</label>
        <input type="text" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" class="input" placeholder="6 dígitos numéricos" value="${esc(state.newUserPin)}" oninput="this.value=this.value.replace(/[^0-9]/g,''); state.newUserPin=this.value;" /></div>
      <div class="flex gap-2 justify-end">
        <button onclick="closeNewUserModal()" class="btn-outline px-4 py-2 rounded-lg font-semibold">Cancelar</button>
        <button onclick="createUser()" class="btn-primary px-4 py-2 rounded-lg font-semibold">Crear usuario</button>
      </div>
    </div>
  </div>`;
}
async function createUser() {
  const name = state.newUserName.trim().toLowerCase();
  if (!name) { showToast('Falta dato', 'Usuario requerido', 'error'); return; }
  if (!/^\d{6}$/.test(state.newUserPin)) { showToast('PIN inválido', 'Debe tener exactamente 6 dígitos', 'error'); return; }
  if (!await tryApi('POST', '/usuarios', { rol: state.newUserRol, username: name, pin: state.newUserPin })) return;
  state.showNewUserModal = false; state.newUserPin = '';
  await loadData();
  showToast('Usuario creado', `${name} · ${state.newUserRol}`);
}

function renderAdminAuditoria() {
  return renderAuditCard(filteredAudit());
}
function filteredAudit() {
  return data.auditLog.filter(r => {
    if (state.auditFilterRol !== 'todos' && r.role !== state.auditFilterRol) return false;
    if (state.auditFilterUser && !r.user.toLowerCase().includes(state.auditFilterUser.toLowerCase())) return false;
    if (state.auditFilterText && !(`${r.action} ${r.details}`.toLowerCase().includes(state.auditFilterText.toLowerCase()))) return false;
    return true;
  });
}
function renderAuditCard(rows) {
  return `<div class="card p-6">
    <div class="flex items-start justify-between mb-4">
      <div><h2 class="display text-xl">Auditoría del sistema</h2>
        <p class="text-sm" style="color: var(--muted);">${rows.length} de ${data.auditLog.length} eventos (los más recientes)</p></div>
      <button onclick="exportAudit()" class="btn-green px-4 py-2 rounded-lg text-sm font-bold" style="font-family: Raleway;">📥 Exportar log</button>
    </div>
    <div class="grid md:grid-cols-3 gap-3 mb-4">
      <select class="input" onchange="state.auditFilterRol=this.value; render();">
        <option value="todos">Todos los roles</option>
        <option value="admin" ${state.auditFilterRol==='admin'?'selected':''}>Admin</option>
        <option value="generador" ${state.auditFilterRol==='generador'?'selected':''}>Generador</option>
        <option value="verificador" ${state.auditFilterRol==='verificador'?'selected':''}>Verificador</option>
        <option value="sistema" ${state.auditFilterRol==='sistema'?'selected':''}>Sistema</option>
      </select>
      <input class="input" placeholder="Filtrar por usuario" value="${esc(state.auditFilterUser)}" oninput="state.auditFilterUser=this.value; rerenderKeepFocus(this);" />
      <input class="input" placeholder="Buscar en acciones o detalles" value="${esc(state.auditFilterText)}" oninput="state.auditFilterText=this.value; rerenderKeepFocus(this);" />
    </div>
    <div class="rounded-lg overflow-hidden max-h-[600px] overflow-y-auto" style="border: 1px solid var(--ef-divider);">
      ${rows.length === 0 ? `<div class="p-8 text-center" style="color: var(--muted);">Sin eventos con los filtros aplicados</div>`
        : rows.map(r => `<div class="audit-row">
            <div class="flex items-start gap-3 flex-wrap">
              <span class="text-xs min-w-[110px]" style="color: var(--muted); font-family: 'Courier New', monospace;">${r.ts}</span>
              <span class="role-badge role-${esc(r.role)}">${esc(r.role)}</span>
              <span class="font-semibold">${esc(r.user)}</span>
              <span style="color: var(--ef-ink);">${esc(r.action)}</span>
            </div>
            ${r.details ? `<div class="text-xs mt-1 ml-[130px] break-all" style="color: var(--muted);">${esc(r.details)}</div>` : ''}
          </div>`).join('')}
    </div>
  </div>`;
}
function exportAudit() {
  const rows = filteredAudit();
  const fname = `auditoria_${todayDDMMAAAA().replace(/\//g, '-')}.csv`;
  downloadCSV(fname, [['Fecha', 'Rol', 'Usuario', 'Acción', 'Detalle'], ...rows.map(r => [r.ts, r.role, r.user, r.action, r.details])]);
  api('POST', '/eventos', { accion: 'Exportación de auditoría', detalle: `${rows.length} eventos · ${fname}` }).catch(() => {});
  showToast('Auditoría exportada', `${rows.length} eventos`);
}

function renderAdminConfiguracion() {
  if (!state.cfgDraft) state.cfgDraft = { ...data.config };
  const dirty = JSON.stringify(state.cfgDraft) !== JSON.stringify(data.config);
  return `<div class="grid lg:grid-cols-2 gap-6">
    <div class="card p-6">
      <h2 class="display text-xl mb-1">Parámetros operativos</h2>
      <p class="text-sm mb-6" style="color: var(--muted);">Estos valores afectan toda la operación. Los códigos ya generados conservan los parámetros del momento de generación.</p>
      <div class="mb-4"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Días de validez del código</label>
        <input type="number" min="1" max="365" class="input" value="${esc(state.cfgDraft.codigoValidezDias)}" onchange="state.cfgDraft.codigoValidezDias=parseInt(this.value)||30; render();" /></div>
      <div class="mb-4"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Horas máximas de estadía</label>
        <input type="number" min="1" max="240" class="input" value="${esc(state.cfgDraft.estadiaHorasMax)}" onchange="state.cfgDraft.estadiaHorasMax=parseInt(this.value)||24; render();" /></div>
      <div class="mb-4"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Máximo de códigos por generación</label>
        <input type="number" min="1" max="100" class="input" value="${esc(state.cfgDraft.maxCodigosPorGeneracion)}" onchange="state.cfgDraft.maxCodigosPorGeneracion=parseInt(this.value)||20; render();" /></div>
      <div class="mb-4"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Texto del header</label>
        <input class="input" value="${esc(state.cfgDraft.headerTexto)}" onchange="state.cfgDraft.headerTexto=this.value; render();" /></div>
    </div>
    <div class="card p-6">
      <h2 class="display text-xl mb-1">Notificaciones</h2>
      <p class="text-sm mb-6" style="color: var(--muted);">Direcciones que reciben emails de eventos importantes.</p>
      <div class="mb-4"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Email destinatario (Para)</label>
        <input type="email" class="input" value="${esc(state.cfgDraft.notifEmailTo)}" onchange="state.cfgDraft.notifEmailTo=this.value; render();" /></div>
      <div class="mb-4"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Email en copia (CC)</label>
        <input type="email" class="input" value="${esc(state.cfgDraft.notifEmailCc)}" onchange="state.cfgDraft.notifEmailCc=this.value; render();" /></div>
      <div class="mb-4"><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Alertar cuando un vehículo lleva más de N horas (h)</label>
        <input type="number" min="1" max="48" class="input" value="${esc(state.cfgDraft.alertaEstadiaHoras)}" onchange="state.cfgDraft.alertaEstadiaHoras=parseInt(this.value)||22; render();" /></div>
      <div class="mt-6 p-3 rounded-lg text-xs" style="background: rgba(217,119,6,.08); border: 1px solid rgba(217,119,6,.25); color: #92400e;">
        💡 El envío de mails todavía no está conectado: por ahora los eventos quedan registrados en Auditoría.
      </div>
    </div>
  </div>
  <div class="mt-6 card p-4 flex items-center justify-between ${dirty ? 'border-2' : ''}" style="${dirty?'border-color: #d97706;':''}">
    <div>${dirty ? '<span class="font-semibold" style="color: #92400e;">⚠ Hay cambios sin guardar</span>' : '<span style="color: var(--muted);">Configuración sincronizada</span>'}</div>
    <div class="flex gap-2">
      ${dirty ? `<button onclick="state.cfgDraft={...data.config}; render();" class="btn-outline px-4 py-2 rounded-lg font-semibold">Descartar</button>` : ''}
      <button onclick="saveConfig()" ${dirty?'':'disabled'} class="btn-primary px-4 py-2 rounded-lg font-semibold">Guardar configuración</button>
    </div>
  </div>`;
}
async function saveConfig() {
  const r = await tryApi('PUT', '/config', state.cfgDraft);
  if (!r) return;
  data.config = r.config; state.cfgDraft = { ...r.config };
  showToast('Configuración guardada', '');
}

// =========================================================
// CAMBIO DE CONTRASEÑA (admin; obligatorio en el primer ingreso)
// =========================================================
function renderCambiarClave() {
  const forzado = state.user.debeCambiar;
  return `${renderHeader('')}
    <main class="max-w-md mx-auto px-6 py-16">
      <div class="card p-8">
        <div class="-mx-8 -mt-8 mb-8 h-1.5 rounded-t-xl" style="background: var(--ef-ink);"></div>
        <h2 class="display text-xl text-center mb-1">Cambiar contraseña</h2>
        <p class="text-sm text-center mb-6" style="color: var(--muted);">${forzado ? 'Es tu primer ingreso: elegí una contraseña propia para continuar.' : 'Usuario ' + esc(state.user.username)}</p>
        <form onsubmit="event.preventDefault(); doCambiarClave();" class="space-y-4">
          <div><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Contraseña actual</label><input id="pwActual" type="password" class="input" autocomplete="current-password" /></div>
          <div><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Contraseña nueva (mínimo 10 caracteres)</label><input id="pwNueva" type="password" class="input" autocomplete="new-password" /></div>
          <div><label class="text-sm font-semibold block mb-1" style="font-family: Raleway;">Repetir contraseña nueva</label><input id="pwNueva2" type="password" class="input" autocomplete="new-password" /></div>
          <button type="submit" class="w-full py-3 rounded-lg font-bold text-white" style="background: var(--ef-ink); font-family: Raleway;">Guardar</button>
          <button type="button" onclick="${forzado ? 'logout()' : "nav('admin')"}" class="w-full text-sm hover:underline" style="color: var(--muted);">${forzado ? 'Salir' : 'Volver al panel'}</button>
        </form>
      </div>
    </main>`;
}
async function doCambiarClave() {
  const actual = document.getElementById('pwActual').value;
  const nueva = document.getElementById('pwNueva').value;
  if (nueva !== document.getElementById('pwNueva2').value) { showToast('Error', 'Las contraseñas nuevas no coinciden', 'error'); return; }
  if (nueva.length < 10) { showToast('Error', 'La contraseña nueva debe tener al menos 10 caracteres', 'error'); return; }
  if (!await tryApi('POST', '/cambiar-clave', { actual, nueva })) return;
  state.user.debeCambiar = false;
  await loadData();
  nav('admin');
  showToast('Contraseña actualizada', '');
}

// =========================================================
// MAIN RENDER
// =========================================================
function render() {
  destroyCharts();
  const html = (() => {
    switch (state.route) {
      case 'home': return renderHome();
      case 'gen-login': return renderGenLogin();
      case 'gen-dashboard': return state.user?.role === 'generador' ? renderGenDashboard() : renderGenLogin();
      case 'gen-result': return state.user?.role === 'generador' && state.genResult ? renderGenResult() : renderGenLogin();
      case 'ver-login': return renderVerLogin();
      case 'ver-main': return state.user?.role === 'verificador' ? renderVerMain() : renderVerLogin();
      case 'admin-login': return renderAdminLogin();
      case 'admin': return state.user?.role === 'admin' && !state.user.debeCambiar ? renderAdmin() : renderAdminLogin();
      case 'cambiar-clave': return state.user ? renderCambiarClave() : renderHome();
      default: return renderHome();
    }
  })();
  const toast = state.toast ? `<div class="toast">
    <div class="font-bold" style="${state.toast.kind==='error'?'color: var(--red);':'color: var(--ef-ink); font-family: Raleway;'}">${state.toast.title}</div>
    ${state.toast.body ? `<div class="text-sm mt-1" style="color: var(--muted);">${state.toast.body}</div>` : ''}
  </div>` : '';
  document.getElementById('app').innerHTML = html + toast;
}
render();
// Si ya había una sesión abierta en este navegador, se retoma.
api('GET', '/sesion').then(r => { if (r.user) afterLogin(r.user); }).catch(() => {});
// Pre-cargar logo en background para que el PDF salga rápido
loadLogoDataURL().catch(() => console.warn('Logo no pudo precargarse (logo_ef.png falta en la carpeta).'));
</script>
